version: '3.3'

services:
  gymora-api:
    container_name: gymora-api
    restart: always
    image: node:20.10.0
    ports:
      - 4001:3000
    volumes:
      - ./:/usr/src/gymora
    working_dir: /usr/src/gymora

    networks:
      - monorepo-network

    # FOR PRODUCTION
    command: bash -c "npm install && npm run build && npm run start:prod"

  gymora-batch:
    container_name: gymora-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 4002:3008
    volumes:
      - ./:/usr/src/gymora
    working_dir: /usr/src/gymora

    networks:
      - monorepo-network

    # FOR PRODUCTION
    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
